services:
  # ---------------------------------------------------------------------------
  # BACKEND (.NET 9 API)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./SmartInvoice.API
      dockerfile: Dockerfile.dev
    container_name: smartinvoice-backend
    restart: always
    ports:
      - "${BACKEND_PORT_EXTERNAL}:${BACKEND_PORT}"
    volumes:
      - ./SmartInvoice.API:/app
      - /app/obj
      - /app/bin
    # Load environment variables from root .env file
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - DOTNET_WATCH_SUPPRESS_PROMPTS=1
      - OCR_API_ENDPOINT=${OCR_API_ENDPOINT}
      - AWS_SQS_OCR_URL=${AWS_SQS_OCR_URL}
      - AWS_SQS_URL=${AWS_SQS_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET}
      - VnPay__TmnCode=${VNPAY_TMN_CODE}
      - VnPay__HashSecret=${VNPAY_HASH_SECRET}
      - VnPay__ReturnUrl=${VNPAY_RETURN_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

    depends_on:
      - postgres
    networks:
      - smartinvoice-network

  # ---------------------------------------------------------------------------
  # DATABASE (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: smartinvoice-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DB_PORT_EXTERNAL}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartinvoice-network
  # ---------------------------------------------------------------------------
  # FRONTEND (React/Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./SmartInvoice.Frontend
      dockerfile: Dockerfile.dev
    container_name: smartinvoice-frontend
    ports:
      - "${FRONTEND_PORT_EXTERNAL}:${FRONTEND_PORT}"
    volumes:
      - ./SmartInvoice.Frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - smartinvoice-network
  # ---------------------------------------------------------------------------
  # AI SERVICE (Python OCR)
  # ---------------------------------------------------------------------------
  smartinvoice-ocr:
    build:
      context: ./invoice_ocr
      dockerfile: Dockerfile
    container_name: smartinvoice-ocr
    restart: always
    ports:
      - "${OCR_PORT}:${OCR_PORT}"
    environment:
      - DEVICE=cpu
      - HOST=0.0.0.0
      - PORT=${OCR_PORT}
    volumes:
      - ./invoice_ocr:/app
    networks:
      - smartinvoice-network

networks:
  smartinvoice-network:
    driver: bridge

volumes:
  postgres_data:

